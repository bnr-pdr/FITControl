server.port=${SERVER_PORT:8080}

# Carrega automaticamente o arquivo backend/.env (independente do diretorio de execucao)
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Conexao exclusiva como academia_app (NUNCA academia_owner)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/academia}
spring.datasource.username=${DB_USER:academia_app}
spring.datasource.password=${DB_PASSWORD:SENHA_APP}
spring.datasource.driver-class-name=org.postgresql.Driver

# Fuso horario alinhado ao PostgreSQL
spring.jackson.time-zone=America/Sao_Paulo

# Segredos JWT e QR Code HMAC
app.jwt.secret=${JWT_SECRET:chave_secreta_jwt_com_pelo_menos_32_caracteres_aqui_2026}
app.jwt.expiration-ms=28800000
app.qr.hmac-secret=${QR_HMAC_SECRET:chave_secreta_hmac_qrcode_recepcao_32_caracteres_aqui}
app.qr.ttl-seconds=45