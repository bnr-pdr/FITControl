services:
  db:
    image: postgres:16-alpine
    container_name: academia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}
      LOAD_SEED: ${LOAD_SEED:-false}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      # 127.0.0.1 = só a sua máquina acessa (não expõe na rede da faculdade/wifi)
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
